<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relativistic Space Travel Simulator</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</head>
<body>

    <h1>Relativistic Space Travel Simulator</h1>

    <div id="status">
    Initializing simulation...
    </div>

    <div class="controls">

        <label for="destination">Destination:</label>

        <select id="destination">
            <option value="4.37">Alpha Centauri</option>
            <option value="5.96">Barnard's Star</option>
            <option value="8.6">Sirius</option>
            <option value="11.9">Tau Ceti</option>
            <option value="39.5">TRAPPIST-1</option>
        </select>

        <label for="acceleration">
            Acceleration
        </label>

        <input
            type="range"
            id="acceleration"
            min="0.1"
            max="5"
            value="1"
            step="0.1"
        >

        <div id="accelerationDisplay">
            9.81 m/s² (1.00 g)
        </div>

        <button id="runButton">
            Run Simulation
        </button>

    </div>

    <div id="summary"></div>

    <div id="timeGraph"></div>

    <div id="velocityGraph"></div>

    <div id="distanceGraph"></div>

    <div id="distanceVsTimeGraph"></div>

    <script src="app.js"></script>

</body>
</html>
